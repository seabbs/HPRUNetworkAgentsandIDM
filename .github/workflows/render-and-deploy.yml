name: Render and Deploy Slides

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deploy, cancelling in-progress runs on new pushes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.9.32"

      - name: Render slides
        run: quarto render

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Install ffmpeg, fonts and a browser for the video
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core \
            fonts-noto-color-emoji
          uvx --from playwright playwright install --with-deps chromium

      - name: Build the video of the deck
        run: |
          ./scripts/shot-slides.py _shots
          ./scripts/social-video.py
          cp figures/agents-deck.mp4 _site/figures/agents-deck.mp4

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: render
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
